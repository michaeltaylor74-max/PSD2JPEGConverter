name: Build

# Builds Windows, macOS and Linux versions on every push.
# Push a tag such as v1.0.0 to also publish them as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the downloads to (e.g. v1.0.0). Leave blank to just build."
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Linux libraries
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev

      - name: Build (Windows / Linux)
        if: matrix.name != 'macos'
        run: cargo build --release

      - name: Build (macOS, Apple Silicon + Intel)
        if: matrix.name == 'macos'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Package Windows
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory upload | Out-Null
          Copy-Item target/release/psd-to-jpeg-converter.exe "upload/PSD-to-JPEG-Converter-Windows.exe"

      - name: Package macOS app
        if: matrix.name == 'macos'
        run: |
          APP="dist/PSD to JPEG Converter.app"
          mkdir -p "$APP/Contents/MacOS"
          lipo -create -output "$APP/Contents/MacOS/psd-to-jpeg-converter" \
            target/aarch64-apple-darwin/release/psd-to-jpeg-converter \
            target/x86_64-apple-darwin/release/psd-to-jpeg-converter
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>PSD to JPEG Converter</string>
            <key>CFBundleDisplayName</key><string>PSD to JPEG Converter</string>
            <key>CFBundleIdentifier</key><string>com.michaeltaylor.psd-to-jpeg-converter</string>
            <key>CFBundleExecutable</key><string>psd-to-jpeg-converter</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict></plist>
          EOF
          codesign --force --deep --sign - "$APP"
          ln -s /Applications dist/Applications
          mkdir upload
          hdiutil create -volname "PSD to JPEG Converter" -srcfolder dist -ov -format UDZO upload/PSD-to-JPEG-Converter-Mac.dmg

      - name: Package Linux
        if: matrix.name == 'linux'
        run: |
          mkdir upload
          tar -czf upload/PSD-to-JPEG-Converter-Linux.tar.gz -C target/release psd-to-jpeg-converter

      - uses: actions/upload-artifact@v4
        with:
          name: PSD-to-JPEG-Converter-${{ matrix.name }}
          path: upload/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: upload/*
