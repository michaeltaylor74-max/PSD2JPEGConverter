name: Build

# Builds Windows, macOS and Linux versions on every push.
# Push a tag such as v1.0.0 to also publish them as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release version to publish, e.g. v1.2.0 (created if it does not exist). Leave blank to just build."
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Linux libraries
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev

      - name: Build (Windows / Linux)
        if: matrix.name != 'macos'
        run: cargo build --release

      - name: Build (macOS, Apple Silicon + Intel)
        if: matrix.name == 'macos'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Package Windows
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory upload | Out-Null
          Copy-Item target/release/psd-to-jpeg-converter.exe "upload/PSD-to-JPEG-Converter-Windows.exe"

      - name: Package macOS app
        if: matrix.name == 'macos'
        run: |
          APP="dist/PSD to JPEG Converter.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          mkdir icon.iconset
          for n in 16 32 128 256 512; do
            sips -z $n $n assets/icon-1024.png --out icon.iconset/icon_${n}x${n}.png >/dev/null
            sips -z $((n*2)) $((n*2)) assets/icon-1024.png --out icon.iconset/icon_${n}x${n}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/AppIcon.icns"
          lipo -create -output "$APP/Contents/MacOS/psd-to-jpeg-converter" \
            target/aarch64-apple-darwin/release/psd-to-jpeg-converter \
            target/x86_64-apple-darwin/release/psd-to-jpeg-converter
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>PSD to JPEG Converter</string>
            <key>CFBundleDisplayName</key><string>PSD to JPEG Converter</string>
            <key>CFBundleIdentifier</key><string>com.michaeltaylor.psd-to-jpeg-converter</string>
            <key>CFBundleExecutable</key><string>psd-to-jpeg-converter</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict></plist>
          EOF
          codesign --force --deep --sign - "$APP"
          ln -s /Applications dist/Applications
          mkdir upload
          hdiutil create -volname "PSD to JPEG Converter" -srcfolder dist -ov -format UDZO upload/PSD-to-JPEG-Converter-Mac.dmg

      - name: Package Linux
        if: matrix.name == 'linux'
        run: |
          mkdir upload
          tar -czf upload/PSD-to-JPEG-Converter-Linux.tar.gz -C target/release psd-to-jpeg-converter

      - uses: actions/upload-artifact@v4
        with:
          name: PSD-to-JPEG-Converter-${{ matrix.name }}
          path: upload/*

  # Runs once all three builds succeed, and puts the files on a GitHub Release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: upload
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: PSD to JPEG Converter ${{ inputs.release_tag || github.ref_name }}
          make_latest: true
          body: |
            **Windows:** download `PSD-to-JPEG-Converter-Windows.exe` below and double-click it. Nothing to install. If a blue "Windows protected your PC" box appears, click **More info → Run anyway**.

            **Mac:** download `PSD-to-JPEG-Converter-Mac.dmg`, open it and drag the app into Applications. The first time, right-click the app and choose **Open**.

            (Ignore the two "Source code" links; GitHub adds those to every release.)
          files: upload/*
