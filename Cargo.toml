[package]
name = "psd-to-jpeg-converter"
version = "1.1.0"
edition = "2021"
description = "Batch convert Photoshop PSD/PSB files (including every subfolder) to JPEG, keeping the folder structure."
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = "0.37"
jpeg-encoder = "0.6"
psd = "0.3"
rayon = "1"
rfd = "0.17"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
